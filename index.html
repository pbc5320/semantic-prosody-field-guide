  <h1>Semantic Prosody Master Notes</h1>

<script>
/* ---------- DATA (from the master document) ---------- */
const PH={founding:{n:"Founding",c:"--p1"},consol:{n:"Consolidation",c:"--p2"},crit:{n:"Critique",c:"--p3"},test:{n:"New tests",c:"--p4"},app:{n:"Applications",c:"--p5"},periph:{n:"Peripheral",c:"--p6"}};

const LIT=[
{id:"louw",y:1993,short:"Louw",title:"Irony in the text or insincerity in the writer?",ph:"founding",
 cite:"Louw, B. (1993). Irony in the text or insincerity in the writer? The diagnostic potential of semantic prosodies. In M. Baker, G. Francis and E. Tognini-Bonelli (Eds.), *Text and Technology: In Honour of John Sinclair* (pp. 157–176). John Benjamins.",
 one:"Names the concept and uses it as a test for irony and insincerity.",
 tags:["Full text"],
 f:[["Question","Can a corpus-derived prosody give an objective test for irony and for insincerity?"],
 ["Core claim","Irony draws its effect from a collocative clash: a word is used against the evaluative company it normally keeps, and the reader senses the clash, often subliminally. A consistent background prosody must exist to clash with."],
 ["Evidence","Concordances (18 million words, later 37 million) for *utterly* (overwhelmingly unfavourable), which explains the ominous undertone of Larkin's “Utterly unlike the snow”; *bent on* (destruction, mayhem), making Lodge's “bent on self-improvement” in *Small World* ironic; *days are* in Larkin's “Days”; *fine friend*."],
 ["Insincerity","A British Council speaker called UK–Zimbabwe university links “symptomatic of” the University of Zimbabwe's reputation. *Symptomatic of* collocates with paranoia and disorders, so Louw suggests the clash may reveal a concealed attitude."],
 ["Other points","Prosody can split by grammar (BUILD UP is good when transitive with a human subject, bad when intransitive). Prosodies “hunt in packs”. They are “essentially a phenomenon that has been only revealed computationally”, so intuition cannot reliably find them."],
 ["Why it matters","It set up the two claims critics attack most: deviation signals irony or insincerity, and prosody is hidden from intuition."]]},

{id:"stubbs",y:1995,short:"Stubbs",title:"Collocations and semantic profiles",ph:"founding",
 cite:"Stubbs, M. (1995). Collocations and semantic profiles: On the cause of the trouble with quantitative studies. *Functions of Language*, 2(1), 23–55.",
 one:"Supplies the statistics and the CAUSE case study.",
 tags:["Scan: via secondary guide"],warn:"Both copies in my folder are scans with no text layer. This entry follows a secondary study guide, spot-checked against later papers that quote Stubbs. I treat page numbers and quotes as unconfirmed.",
 f:[["Question","Does CAUSE carry a consistent unfavourable prosody, and which statistics validly show it?"],
 ["Data","Corpora from the 1-million-word LOB to the 120-million-word Cobuild/Bank of English; comparison with OALD, Longman, Collins and the OED."],
 ["Findings","In the 1-million-word corpus “nearly 80 per cent” of CAUSE's collocates are negative, 18% neutral, 2% positive. The pattern holds at 120 million (core collocates *problem(s), damage, death(s), disease, concern, cancer, pain, trouble*). Dictionaries define CAUSE neutrally. A rarer sense, “a good cause”, is neutral to positive, so sense matters."],
 ["Contrasts","AFFECT almost uniformly negative; CREATE mixed; REASON largely neutral; PROVIDE positive. “Causing work” is bad, “providing work” is good."],
 ["Statistics","I-value is a log transform of observed/expected frequency, non-directional and unreliable for rare items. T-score tracks raw joint frequency. Use both as rough comparative indicators and filter by minimum frequency."],
 ["Theory","Argues against Chomsky's rejection of discovery procedures; links frequent usage to the langue/parole boundary; notes implications for stylistics."],
 ["Why it matters","Fixed the CAUSE example and the I/T toolkit nearly every later paper reuses. Dating of his shift to “discourse prosody” differs: Hunston, Stewart and Partington (2004) cite Stubbs (2001); Cheng (2013) implies 1995."]]},

{id:"part98",y:1998,short:"Partington",title:"Connotation and semantic prosody",ph:"consol",
 cite:"Partington, A. (1998). Connotation and semantic prosody. Ch. 4 of *Patterns and Meanings* (pp. 65–78). John Benjamins.",
 one:"Places prosody inside the older idea of connotation.",tags:["Full text"],
 f:[["Question","How does prosody fit within older ideas of connotation, and what is it good for?"],
 ["Data","Newspaper CD-ROMs (*The Independent* 1992, *The Telegraph* 1993); ten dictionary titles: three general dictionaries (1967, 1988, 1993), three learner dictionaries from the 1980s and four from 1995."],
 ["Findings","Three connotation types: social/situational, cultural, expressive. Prosody is one subtle aspect of expressive connotation: the spreading of connotational colouring beyond single word boundaries. COMMIT (41 citations: grievous bodily harm, suicide, deception) and RIFE (crime, disease, poverty) carry an unfavourable prosody. SET IN is unflagged in three non-learner dictionaries but flagged by Cobuild 1987 and all four 1995 learner dictionaries. PEDDLE is almost always unfavourable, and three of the four 1995 learner dictionaries show this (Cobuild, CIDE, OALD) while LDOCE 1995 is silent."],
 ["Beyond words","In 58 lines DEALINGS has only four explicit value-judgement modifiers (three unfavourable, one favourable) but sits with *investigation into, allegations about, disreputable parties*, so prosody can work above single words. GREEN FUNDAMENTALISM shows a newspaper, probably unwittingly, giving a collocation status by repetition. English IMPRESSIVE vs Italian *impressionante* is a prosodic false friend."]]},

{id:"part04",y:2004,short:"Partington",title:"“Utterly content in each other's company”",ph:"consol",
 cite:"Partington, A. (2004). “Utterly content in each other's company”: Semantic prosody and semantic preference. *International Journal of Corpus Linguistics*, 9(1), 131–156.",
 one:"Separates semantic preference from semantic prosody.",tags:["Full text","2 copies"],
 f:[["Question","What are semantic prosody and semantic preference, and how do they relate?"],
 ["HAPPEN group","1-million-word academic corpus. SET IN almost always unfavourable. Of 50 lines each, *happened* is bad in 24, good in 5, neutral in 21; *occur* bad in 36 of 150 lines vs good in 14; *take place* unfavourable in 31 of 131 vs favourable in 11; *come about* shows little prosody. HAPPEN and OCCUR also prefer non-factual contexts (modals, questions, conditionals)."],
 ["Maximizers","*Absolutely* prefers superlatives; *perfectly* favourable items; *utterly, totally, completely, entirely* prefer “absence” and “change of state”; only *utterly* is described as carrying an unfavourable prosody. *Utterly pleasant* is possible as a deliberate exception."],
 ["Relationship","Preference is a set of collocates; prosody can extend over a wider stretch. Examples: UNDERGO, CAUSE, BROOK."],
 ["Terminology","Disagrees with Stubbs's “discourse prosody”: because competent speakers share primings, prosody is not wholly outside semantics, so he keeps “semantic”."],
 ["Strength varies","SET IN near-categorical; BENT ON less so (*bent on a career in computing* is not ironic); prosody may differ by genre (LAVISH)."]]},

{id:"xm",y:2006,short:"Xiao & McEnery",title:"Collocation, semantic prosody, and near synonymy",ph:"consol",
 cite:"Xiao, R. and McEnery, T. (2006). Collocation, semantic prosody, and near synonymy: A cross-linguistic perspective. *Applied Linguistics*, 27(1), 103–129. doi:10.1093/applin/ami045",
 one:"Shows prosody replicates in Mandarin and varies among near-synonyms.",tags:["Full text"],
 f:[["Question","Is prosody a general property of language or an artefact of English?"],
 ["Data","Matched ~1-million-word English (FLOB, Frown) and Mandarin (LCMC) corpora, plus larger ones (BNC; 15-million-word PDC2000). MI with minimum frequency of 3 (20 for larger corpora)."],
 ["Findings","English CAUSE as a verb is 78% negative (223 of 287). Among near-synonyms: AROUSE 65%, LEAD TO 49%, RESULT IN/FROM 47%, GIVE RISE TO 46%, BRING ABOUT 38%. Chinese CAUSE words range from 99% negative (*zhi4shi3*) to 98% positive (*cu4cheng2*). The CONSEQUENCE group shows graded scales."],
 ["PRICE vs COST","Log-likelihood found no overall difference, but “at any price/cost” is 75–100% metaphorical and negative, so claims must be pinned to phraseological patterns."],
 ["Definition","Semantic preference belongs to the collocates; semantic prosody to the node."],
 ["Why it matters","Cross-linguistic (English–Chinese) evidence that the pattern is not language-specific. My reading is that this bears on the “figment” worry; the authors do not frame it that way. They also report Louw’s observation that euthanasia advocates prefer *bring about death* to *cause death*."]]},

{id:"zeth",y:2006,short:"Zethsen",title:"Creating awareness about a versatile tool",ph:"consol",
 cite:"Zethsen, K. K. (2006). Semantic prosody: Creating awareness about a versatile tool. *Tidsskrift for Sprogforskning*, 4(1–2), 275–294.",
 one:"A primer and manifesto for applied uses.",tags:["Full text"],
 f:[["Aim","A primer and manifesto, not new research."],
 ["Content","Traces the idea from Porzig and Firth to Sinclair's four relations (collocation, colligation, semantic preference, semantic prosody)."],
 ["Applications","Lexicography; critical discourse analysis (TELLY's lazy-passive collocates; New Labour keywords); persuasive writing (Danish *kvalitetstid*, split 8/8 positive vs ironic/negative in 16 lines); translation (Danish *imponerende* patterns like IMPRESSIVE, unlike Italian *impressionante*); language teaching."]]},

{id:"cheng",y:2013,short:"Cheng",title:"“Semantic Prosody” (Encyclopedia of Applied Linguistics)",ph:"consol",
 cite:"Cheng, W. (2013). Semantic prosody. In C. Chapelle (Ed.), *The Encyclopedia of Applied Linguistics*. Blackwell. doi:10.1002/9781405198431.wbeal1062",
 one:"A short map of who said what.",tags:["Full text","2 copies","Secondary source"],
 f:[["What it is","Reference entry with a chronological review of definitions (Sinclair 1987, Louw 1993, Bublitz 1996, Stubbs, Sinclair 1996 and 2004, Partington 2004, Hoey 2005, Baker et al. 2006)."],
 ["Themes","Themes drawn from Hunston (2007) and Stewart (2010): evaluative function and hidden quality; synchronic vs diachronic; word vs longer unit; inferring prosody from concordances."],
 ["Also","Reproduces Stewart's two feature lists, his proposed split, and his objections to inferring prosody from concordances."],
 ["Use","A map, not a primary source. Check claims against the originals."]]},

{id:"hun",y:2007,short:"Hunston",title:"Semantic prosody revisited",ph:"crit",
 cite:"Hunston, S. (2007). Semantic prosody revisited. *International Journal of Corpus Linguistics*, 12(2), 249–268. doi:10.1075/ijcl.12.2.09hun",
 one:"The term names two things; observation is not explanation or prediction.",tags:["Full text","2 copies"],
 f:[["Claim 1","Most writers use “semantic prosody” for the implied attitude of a word given its typical companions; Sinclair uses it for the discourse function of a unit of meaning. She suggests “semantic preference” or “attitudinal preference” for the first."],
 ["Counter-examples","In *New Scientist*, CAUSE combines with inanimate processes and no attitude is discernible. BUDGE flips from frustration to determination with a first-person subject. PERSISTENT is negative before a noun but can go either way predicatively."],
 ["Claim 2","Corpus evidence can record a pattern (observation) or explain a reader's reaction, but Louw's claim that an atypical collocation necessarily signals irony is prediction. One clean counter-example, “fresh to the point of invigoration”, undermines the prediction."],
 ["Claim 3","In a 13-article “conflict corpus” of adversarial papers, SEEM(S) TO THINK really adds negative evaluation, SIGNIFICANCE is only the topic of dispute, and TO HAVE sits near negative evaluation in 20 of 28 instances only because the whole corpus is hostile."]]},

{id:"philip",y:2010,yl:"c. 2010",short:"Philip",title:"Why prosodies aren't always present",ph:"crit",
 cite:"Philip, G. Why prosodies aren't always present: Insights into the idiom principle. (Venue and year not shown in the file; it cites Stewart 2009, so c. 2009–11.)",
 one:"Splits semantic association from semantic prosody; analysability explains absence.",tags:["Full text","Citation incomplete"],
 f:[["Question","Why do some phrases show no prosody?"],
 ["Move 1","Louw's “aura of meaning” describes rather than defines, and drops the functional half. Philip splits semantic association (optional, psychological, word-centred, polarised) from semantic prosody (obligatory, pragmatic, phraseological, text-bound)."],
 ["Move 2","Semantic analysability: prosody matters in proportion to how far a phrase's meaning cannot be recovered from its words. Five cases run along the scale: FROM BAD TO WORSE, CAUGHT IN THE ACT, CAUGHT RED-HANDED, THE GRASS IS GREENER, COLD TURKEY."],
 ["Mechanism","Deliteralisation: as a phrase's literal sense fades, pragmatic information about use fills the gap. The obsolete *wet the swab* shows meaning lost when the community of use disappears."],
 ["Against Whitsitt","Answers Whitsitt’s view, which she paraphrases as a “figment of corpus linguists' imaginations”: prosody is sometimes redundant for good linguistic reasons."]]},

{id:"stew",y:2010,short:"Stewart",title:"Semantic Prosody: A Critical Evaluation",ph:"crit",
 cite:"Stewart, D. (2010). *Semantic Prosody: A Critical Evaluation*. Routledge Advances in Corpus Linguistics.",
 one:"Book-length audit; proposes “discourse prosody” vs “semantic prosody”.",tags:["Full text","192-page proof"],
 f:[["Aim","Examine the characteristics attributed to the notion, using BNC concordances except where reproducing other scholars’ work. He does not say prosody is fake."],
 ["Ch. 1–3","Sinclair's version is synchronic, functional, unit-based and not restricted to good/bad. Louw’s is word-based and binary, and is treated within both diachronic and synchronic frameworks. The “tainting” metaphor is rarely tested with historical data."],
 ["Ch. 4–5","Accounts disagree, often unacknowledged, on word vs sequence and neutral vs evaluative. Many cited examples do not clearly show evaluation. Criteria for “consistent” are loose."],
 ["Ch. 6","The format of the concordance line shapes what analysts see."],
 ["Ch. 7","Intuition is involved at every step of corpus work, so the claim that prosody is inaccessible to intuition is overstated. Stubbs's “80%” and Xiao & McEnery's coding rest on analyst intuition."],
 ["Ch. 8","Hoey’s lexical priming overlaps, but its individual, psychological grounding is one of the major differences from the unit of meaning; Stewart also finds common ground and notes a corpus may show primings shared by a community."],
 ["Ch. 9","Split the term into discourse prosody (Sinclair) and semantic prosody (Louw). Open questions include how to define the co-text around a node and a test of the diachronic story."]]},

{id:"sn",y:2012,short:"Smith & Nordquist",title:"A critical and historical investigation",ph:"test",
 cite:"Smith, K. A. and Nordquist, D. (2012). A critical and historical investigation into semantic prosody. *Journal of Historical Pragmatics*, 13(2), 291–312.",
 one:"How CAUSE became negative, and why prosody may live in constructions.",tags:["Full text"],
 f:[["Question","How did CAUSE get its negative prosody?"],
 ["Data","353 coded tokens from Early Modern English (Helsinki Corpus, 1500–1710) vs 208 from the Frown Corpus (early 1990s); “case” senses excluded."],
 ["Findings","Negative tokens rise from 48% to 80.3%; neutral falls from 41% to 18.3%. The shift is steeper for verbs. Verbal CAUSE had a non-negative Causative Construction (*caused my horse to be put into his own stable*) that later disappeared. *Cause of NP* is consistently negative; *cause for NP* is often positive."],
 ["Neutralisation","In Frown, science texts show nearly a third neutral tokens (19 of 64); popular lore and belles lettres are almost entirely negative."],
 ["Argument","Prosody is stored at the level of the construction, built from exemplars. They cite Nordquist (2004: 70% negative in elicited sentences) and Ellis and Frey (2009: priming results)."],
 ["Against Louw","Reject a word-level account; treat science neutralisation as a register fact, not irony."]]},

{id:"tl",y:2019,yl:"c. 2019",short:"Tang & Liu",title:"Solving contradictions with prosody concord",ph:"test",
 cite:"Tang, X. and Liu, G. Solving contradictions in semantic prosody analysis with prosody concord. *International Journal of Corpus Linguistics*. (Scanned 30-page PDF named “1.pdf”; year and volume not on the pages read; file metadata suggests c. 2019.)",
 one:"Collostructions resolve the ALLEVIATE/CAUSE contradiction.",tags:["OCR of scan","Citation incomplete"],
 f:[["Problem","Collocation-based analysis gives negative prosody to ALLEVIATE and CURE because they collocate with disease and problem, which contradicts common sense (Whitsitt 2005 noticed this)."],
 ["Proposal","Use a collostruction (a construction with slots and statistically attracted fillers, via Lexeme-based Collexeme Analysis) as the locus of analysis, with one presupposition and three rules (including Head-Argument and Head-Adjunct Prosody rules)."],
 ["Results","Case studies of BUDGE, CREDIBILITY, CAUSE and ALLEVIATE (BNC). ALLEVIATE comes out mainly positive; CAUSE mainly neutral (in 57.81% of collostructions no collexeme primes a prosody)."],
 ["Definition","“An implicit but regular evaluative meaning associated with a lemma”; the word-vs-unit schools Hunston describes are two views of one thing (following Morley and Partington 2009)."]]},

{id:"sk",y:2023,yl:"2023",short:"Sugawara & Kambara",title:"Revisiting semantic prosody of cause",ph:"test",
 cite:"Sugawara, Y. and Kambara, K. (2023). Revisiting semantic prosody of *cause*: A sentiment analysis. *Journal of Corpus-based Lexicology Studies*, 6. Japan Association for English Corpus Studies, Lexicology SIG.",
 one:"CAUSE retested with collexeme analysis and VADER; mostly neutral.",tags:["Full text","Method caution"],warn:"VADER scores isolated words, so it may under-detect the prosody this literature locates in the construction.",
 f:[["Question","Is CAUSE really negative once raw frequency is replaced by collostructional strength?"],
 ["Data","337 [subject CAUSE object] cases from the TED Corpus Search Engine (about 4.6 million tokens); co-varying collexeme analysis, then VADER scores for subjects, objects and combined phrases."],
 ["Findings","Neutrality predominates in all quartiles; “Neutral–Neutral” is the most common pairing, with objects leaning slightly negative. They conclude CAUSE is not inherently negative and earlier work may have overstated it."],
 ["Authors' caveats","Register is TED talks; positive–positive combinations were rare and unexplained; context left for later work."]]},

{id:"mans",y:2013,short:"Mansoor & Salman",title:"Collocation, colligation and semantic prosody",ph:"app",
 cite:"Mansoor, M. S. and Salman, Y. M. (2013). Collocation, colligation and semantic prosody. (Journal not shown on the copy; received 2012, accepted April 2013; Cihan University, Erbil.)",
 one:"A teaching-oriented study of the adverb *vitally*.",tags:["Full text","Citation incomplete","Full text added"],
 f:[["Aim","Clear definitions of the three notions for EFL learners and teachers."],
 ["Data","260 BNC hits for *vitally*, coded positive, neutral or negative and by text domain."],
 ["Findings","137 hits (about 53%) positive, 73 (28.08%) neutral, 50 (19.23%) negative. Learner dictionaries and textbooks still give too little prosody information."],
 ["Note","Coding by the authors; no reliability check reported. The full text confirms the figures and the dates (received 5/11/2012, accepted 16/4/2013). Journal still not shown."]]},

{id:"benna",y:2014,short:"Benna",title:"Towards a semantic prosodies approach in the study of irony",ph:"app",
 cite:"Benna, S. (2014). Towards a semantic prosodies approach in the study of irony. *Journal of Advances in Linguistics*, 5(1), 493–498.",
 one:"Louw's irony account applied to Hemingway.",tags:["Full text","Small-scale"],
 f:[["Data","Four items from Hemingway's *A Farewell to Arms* (*disgraced, beautiful, devotion, handsomly*) checked in the 100-million-word BNC with log-likelihood (SARA concordancer)."],
 ["Findings","*Disgraced* goes with people who have lost rank (so “the car looked disgraced” clashes); *beautiful* with things pleasing to the eye; *devotion* is glossed in a dictionary as associated with duty, religion, family and love (no BNC collocates reported); *handsomely* returned no BNC hits."],
 ["Position","Adopts Louw's collocative clash but disagrees that prosody is inaccessible to intuition: native speakers he asked guessed the same collocates."],
 ["Note","The Hemingway readings rest on the author's literary interpretation."]]},

{id:"shah",y:2023,short:"Shahzadi et al.",title:"Semantic prosody in news headlines",ph:"app",
 cite:"Shahzadi, K., Jahan, J. and Jahanzeb, K. (2023). An analysis of semantic prosody in news headlines. Vol. 7(3). (Journal name not shown on the copy.)",
 one:"LIWC sentiment on 10,000 headlines.",tags:["Full text","Do not cite unchecked"],warn:"LIWC is a dictionary-based sentiment tool that scores words, not collocational patterning. The file does not explain how reader responses were collected, and several 2020–2023 references could not be verified. A clear case of the sentiment/prosody conflation.",
 f:[["Data","10,000 headlines (2,500 each from CNN, Fox News, ESPN, Bleacher Report, Entertainment Weekly, Variety, CNET, Wired), analysed with LIWC."],
 ["Reported","52.4% positive, 11.9% negative, 35.7% neutral; entertainment most positive (67.8%), politics most negative (14.1%); online more positive than print; positive “prosody” headlines drew more engagement."]]},

{id:"akh",y:2025,short:"Akhtar et al.",title:"Semantic prosody in The Runaways",ph:"app",
 cite:"Akhtar, N., Nasar, W., Anwar, M. N. and Sajid, E. (2025). Semantic prosody in *The Runaways*: A corpus-based investigation of political discourse. *Journal of Applied Linguistics and TESOL*, 8(4).",
 one:"Corpus stylistics on a Pakistani political novel.",tags:["Full text","Partly read"],
 f:[["Method","Mahlberg's model of corpus stylistics; LancsBox X; keywords and lexical bundles in Fatima Bhutto's novel."],
 ["Findings","Nodes such as *Pakistani, Islam, journey, alone, power* link to identity, displacement and social control; the authors’ conclusion calls *jihad, faith, radical, freedom, infidels* negative, but their own Table 2 codes jihad as positive, faith as dominantly positive and freedom as ambiguous, so the paper contradicts itself."],
 ["Note","I read the abstract, framing and conclusion. The study treats prosody largely as node-level polarity, in the Louw tradition."]]},

{id:"sidra",y:2025,short:"Sidra & Anbreen",title:"Beneficent in Pickthall's Qur'an translation",ph:"app",
 cite:"Sidra and Anbreen, T. (2025). Semantic prosody of *Beneficent* in Pickthall's rendering of the Quranic text. *Qualitative Research Journal for Social Studies*, 2(3), 562–578.",
 one:"Sinclair's extended lexical unit applied to a Divine Name.",tags:["Draft copy"],warn:"My file’s name says “corrected resubmission draft”; check it against the published version.",
 f:[["Method","Extended lexical unit; MI3 within 5L–5R; thematic coding of concordance lines supported by tafsir; Bayesian posterior predictive test."],
 ["Findings","Significant collocates *Merciful, One, Say*; evaluative prosody of *Beneficent* 100% favourable; discourse prosodies of invocation, obedience and rejection of attributing offspring to Allah, with invocation reported as over-represented although the omnibus chi-square was not significant (p = .246). The 100% favourable result rests on three collocates."],
 ["Theory","Neutral collocates are absorbed into a favourable environment, so the node appears to determine the prosody; they say this challenges Louw and supports Sinclair's unit of meaning. Scope is one translation and one Divine Name."]]},

{id:"fab",y:2026,short:"Fabian",title:"The lexeme “weaponization”",ph:"app",
 cite:"Fabian, M. (2026). Semantic prosody of the lexeme “weaponization” in English-language media discourse. Uzhhorod National University, no. 29, 296–306.",
 one:"A stable negative prosody in news corpora, 2021–2026.",tags:["Text decoded","Figures inconsistent"],warn:"The abstract gives 0.22 PMW (2021) rising to 1.42 PMW (2023) but the conclusions give 220.00 and 1033.70 PMW; corpus size differs between the English and Ukrainian summaries. The PDF text was garbled and I decoded it. Confirm figures in the published version.",
 f:[["Data","NOW and COCA corpora, 2021–2026; MI, t-score and log-likelihood combined with framing theory and critical discourse analysis."],
 ["Findings","Negative prosody in 91% of contexts; collocations in energy, food security, ecology and state institutions; frequency peak in 2023 by the paper’s abstract, though its tables give 2025 as the highest (the source is inconsistent); a 2025–26 shift from describing external threats to labelling domestic legal and state systems."]]},

{id:"part13",y:2015,yl:"2015",short:"Partington",title:"Evaluative prosody (ch. 10)",ph:"consol",
 cite:"Partington, A. (2015). Evaluative prosody. In K. Aijmer & C. Rühlemann (Eds.), *Corpus Pragmatics: A Handbook* (pp. 279–303). (Year and book taken from Looi & Cacciato’s reference list; the file itself shows no title page.)",
 one:"Renames the concept “evaluative prosody” and answers Hunston, Stewart and Whitsitt.",tags:["Full text","Citation incomplete","Second batch"],
 f:[["Data","SiBol 05, a 150-million-word corpus of UK broadsheet newspaper texts from 2005."],
 ["Terminology","Name is much debated: Stubbs mused “pragmatic prosody” or “discourse prosody” (2001; the latter “somewhat tautological”), Bublitz (2003) “emotive prosody”. Partington proposes “evaluative prosody”. Evaluation is a two-term good/bad system, annotated with a reason, e.g. (good: pleasurable), [bad: dangerous]."],
 ["Two definitions","Textual: a process, the spreading of evaluation beyond single word boundaries. Lexical: an item has a prosody if it typically co-occurs with words of one polarity, especially where this is not obvious."],
 ["Examples","*Brimming with* sits with positive items (confidence, hope). *Fraught with* has 326 occurrences: danger/s 67, risk/s 21, peril 10, hazards 2; it prefers danger, difficulty/problems, complications and anxiety."],
 ["Responses","Hunston's word-vs-text worry is “a false” dichotomy: “two ways of viewing the same phenomenon”. Stewart: speakers use prosody intuitively even if they cannot articulate it. Whitsitt (2005): diachronic change is empirical and cannot be derived from a synchronic corpus; Partington offers case studies as “very strong empirical evidence” that prosodies develop."],
 ["How common","Stubbs: about 5% of words in a 1,000-word sample (2001: 107). Sinclair: part of every unit of meaning. Reading Forest, Stubbs's definition is narrower, limited to non-obvious polarity."],
 ["Variation","BUILD UP changes with syntax (Louw); LAVISH is bad in crime reporting but good in arts reviews; BUDGE depends on control (Duguid 2011)."],
 ["Conclusion","Prosody exists because discourse must cohere evaluatively; it offers “perhaps the strongest evidence ever uncovered that, in normal communication, lexical items are co-selected”."]]},

{id:"msu",y:2020,yl:"n.d.",short:"Meaning-shift chapter",title:"From a unit of meaning to a meaning-shift unit",ph:"crit",
 cite:"Chapter 2, From a unit of meaning to a meaning-shift unit. Cambridge University Press. doi:10.1017/9781108758703.002. (Author and year not shown on the file, which cites works up to 2011.)",
 one:"Argues prosody belongs to the unit of meaning, is synchronic, and is not inherently evaluative.",tags:["Full text","Citation incomplete","Second batch"],
 f:[["Setting","Theoretical frame for the book's later L2 chapters. Walks through Sinclair's unit of meaning, then asks which items carry prosody (word, lemma or unit), a question it treats as one reason authors disagree."],
 ["Claim 1","Prosody is a property of a unit of meaning and is obligatory there. Semantic preference and attitudinal preference are optional."],
 ["Claim 2","It is not inherently evaluative; evaluation is one functional type. If prosody were obligatory and evaluative, everything would have to be evaluative."],
 ["Claim 3","It is synchronic. The idiom principle is a psycholinguistic mechanism, so history is irrelevant at the time of use. Contrasted with Whitsitt's “flow” of meaning from “strong, full, bad words, into the weak, empty, innocent forms”."],
 ["Claim 4","It is not “hidden”. What can be hidden is the pattern, especially where words are delexicalised, because automatic production is not consciously retrievable."],
 ["Also","Notes bad prosodies are detected more often than good ones (Louw 2000; Partington 2004: 133; Stewart 2010: 46) and compares its account with Louw's."]]},

{id:"li",y:2019,short:"Li",title:"Preserve and conserve in EFL teaching",ph:"app",
 cite:"Li, E. (2019). A corpus-assisted study of synonyms in EFL teaching: Take preserve and conserve as examples. *Linguistics and Literature Studies*, 7(2), 39–50. doi:10.13189/lls.2019.070201",
 one:"Sinclair's extended lexical unit applied to near-synonym teaching.",tags:["Full text","Teaching","Second batch"],
 f:[["Data","100-million-word BNC; Sketch Engine (Word Sketch, Sketch Diff, logDice); frequency, genre, colligation, collocation, semantic preference, prosody."],
 ["Findings","Five shared colligation patterns (object, modifier, pp_in-p, subject, and/or). *Preserve* prefers things abstract but important (integrity, unity, independence): keep something as it is. *Conserve* prefers natural resources and ecology (moisture, biodiversity, energy): use as little as possible so it lasts. Both create a mostly positive or neutral prosody, never negative in the object pattern; negative prosody is “marked”."],
 ["Limits","BNC only; does not show learners' actual use; the author suggests adding a learner corpus."]]},

{id:"looi",y:2024,short:"Looi & Cacciato",title:"Data-driven learning of semantic prosody",ph:"app",
 cite:"Looi, J. and Cacciato, A. (2024). Data-driven learning: Technology-enhanced learning of semantic prosody. *Alsic*, 27(1). doi:10.4000/12dds",
 one:"Teaching prosody to 83 students with YouGlish, SKELL and Milanote.",tags:["Full text","Teaching","Second batch"],
 f:[["Data","83 undergraduate social sciences students in a compulsory English course (aiming at B2), Eastern France, 2023–24; questionnaires and 19 logbooks. Demonstration item *bring up* (to mention): undesirable for the interlocutor rather than negative in itself. Others: *end up, unbelievable/incredible, happen*; *set up* as a neutral comparison."],
 ["Findings","63% found the activities useful, 22% neutral, 15% disagreed; 97% believed they could infer the subtler connotational meaning; 50% had trouble with the KWIC format; all 19 logbooks were positive. Milanote did not link formal and non-formal learning because students would not continue outside class."],
 ["Argument","Normalise data-driven learning as a problem-solving tool: spontaneous, accessible, efficient, scaffolded. Prosody is described as marginal in English teaching."],
 ["Limits","Exploratory. It tests learning outcomes and tools, not the concept of prosody."]]},

P.start=()=>`
<h2>The idea in one paragraph</h2>
<p class="lede">From the Overview of my master document.</p>
<p class="big">Semantic prosody is the evaluative “colouring” a word or phrase acquires from the company it habitually keeps, even when its dictionary definition is neutral. <em>CAUSE</em> is the classic case: in a 1-million-word corpus about 80% of occurrences have clearly negative collocates (within 3:3), 18% neutral and 2% positive (Stubbs 1995, as quoted by Stewart; Mansoor reports 90%, and I cannot read the original).</p>
<h3>Where it came from</h3>
<div class="lineage">
 <div class="lin"><b>1934</b><div>Porzig: habitual pairings such as lick/tongue</div></div>
 <div class="lin"><b>1957</b><div>Firth: collocation; phonological prosody as the metaphor</div></div>
 <div class="lin"><b>1966–91</b><div>Sinclair: SET IN and HAPPEN keep unpleasant company</div></div>
 <div class="lin"><b>1993</b><div>Louw names it and uses it to diagnose irony</div></div>
 <div class="lin"><b>1995</b><div>Stubbs adds statistics and CAUSE</div></div>
 <div class="lin"><b>1996–2004</b><div>Sinclair: prosody as the obligatory centre of the unit of meaning</div></div>
</div>
<h3>The arc in four moves</h3>
<div class="grid">
 <div class="box"><span class="eyebrow">Discovery</span><p>Sinclair identifies it, Louw names it, Stubbs measures it.</p><button class="btn alt" data-go="lit" data-f="founding">See founding papers</button></div>
 <div class="box"><span class="eyebrow">Spread</span><p>Partington ties it to connotation, Xiao &amp; McEnery show it holds in Chinese, Zethsen packages it for applied work.</p><button class="btn alt" data-go="lit" data-f="consol">See consolidation</button></div>
 <div class="box"><span class="eyebrow">Critique</span><p>Hunston shows the term names two things, Philip explains absence, Stewart audits every claim and proposes a split.</p><button class="btn alt" data-go="lit" data-f="crit">See critique</button></div>
 <div class="box"><span class="eyebrow">New tests</span><p>History, constructions, sentiment tools, and applications to fiction, news, scripture and political vocabulary (2012–2026).</p><button class="btn alt" data-go="lit" data-f="test">See new tests</button></div>
</div>
<h3>Three things to remember</h3>
<ol class="ul">
 <li><b>Prosody is not preference.</b> Preference is the semantic set of the collocates; prosody is the evaluative meaning (Partington 2004; Xiao &amp; McEnery 2006).</li>
 <li><b>The label collides.</b> Hunston and Philip reserve “semantic prosody” for Sinclair's functional sense; Stewart calls that same sense “discourse prosody”. I say whose labels I use.</li>
 <li><b>CAUSE is no longer a settled example.</b> Older work finds it c. 80% negative; newer work finds it mostly neutral with constructional or sentiment methods (see The debate).</li>
</ol>
<div class="note"><b>My working definition.</b> I treat semantic preference as non-evaluative semantic type and semantic prosody as “evaluative drift” from typical collocates, with a “disruption test”. It fits Xiao &amp; McEnery and Partington's separation of the two layers, and the test is a practical version of Louw's collocative clash. It is my framework rather than one stated in a single source.</div>`;

P.methods=()=>`
<h2>Methods and statistics</h2><p class="lede">Most disputes start with two choices: how to decide a pattern is strong enough, and how to label a collocate favourable or unfavourable.</p>
<div class="tw"><table><thead><tr><th>Tool or step</th><th>What it does</th><th>Where it appears</th><th>Known limit</th></tr></thead><tbody>
${METHODS.map(r=>`<tr>${r.map(c=>`<td>${em(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
<h3>Stubbs's workflow</h3>
<p>Rank collocates by frequency, drop singletons, re-rank by I, drop low-I cases, re-rank by T, drop low-T cases, then read the surviving list by hand. He also warns that “statistical significance” is misapplied because text is not a random sample.</p>
<h3>Two recurring cautions</h3>
<div class="grid"><div class="box"><b>A specialised corpus can manufacture prosody.</b><p>Hunston's 13-article conflict corpus shows almost any word sitting near negative evaluation when every text is hostile.</p></div>
<div class="box"><b>The label is a judgement.</b><p>Stewart notes that Stubbs's “80% negative” and Xiao &amp; McEnery's three-way coding rest on analysts' own native-speaker reactions, the intuition Louw and Stubbs call unreliable.</p></div></div>`;

P.debate=()=>`
<h2>The debate</h2>
<p class="lede">Many disagreements are partly terminological. The substantive ones concern (1) lexical vs constructional, (2) observation vs explanation or prediction, (3) how far sentiment tools can stand in for human coding.</p>
<h3>CAUSE across studies</h3>
<p class="lede" style="margin-bottom:10px">Share of negative tokens or collocates. Methods differ, so compare with care.</p>
<div class="bars" id="bars">${CAUSE.map(c=>`<div class="br"><div>${c[0]}<small>${c[1]}</small></div><div class="tr"><div class="fill" data-w="${c[2]}"></div></div><div class="v">${c[2]}%</div></div>`).join("")}</div>
<div class="grid" style="margin-top:12px">
 <div class="box"><b>Tang &amp; Liu</b><p>CAUSE is mainly neutral: in 57.81% of collostructions no collexeme primes a prosody; negative is more frequent than positive where polarity is expressed.</p></div>
 <div class="box"><b>Sugawara &amp; Kambara</b><p>Neutral–Neutral is the most common subject–object pairing in TED data (VADER), objects leaning slightly negative.</p></div>
</div>
<h3>Flashpoints</h3>
<div id="fps">${FLASH.map((f,i)=>`<div class="fp"><button aria-expanded="false"><span>${f[0]}</span><span aria-hidden="true">+</span></button><div class="sides" hidden><div class="sd"><b>Position A</b>${em(f[1])}</div><div class="sd"><b>Position B</b>${em(f[2])}</div></div></div>`).join("")}</div>
<h3>Terminology map</h3>
<div class="tw"><table><thead><tr><th>Author</th><th>Term used</th><th>What it covers</th></tr></thead><tbody>${TERMS.map(r=>`<tr>${r.map(c=>`<td>${em(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
<h3>Where scholars agree</h3>
<ul class="ul">${AGREE.map(a=>`<li><b>${a[0]}.</b> ${em(a[1])}</li>`).join("")}</ul>
<h3>Open questions</h3>
<div class="tw"><table><thead><tr><th>Question</th><th>Where it comes from</th></tr></thead><tbody>${OPEN.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td></tr>`).join("")}</tbody></table></div>
<h3>Skeptics and secondary voices</h3>
<p>Whitsitt (2005) is the outside sceptic. Philip answers him directly; Hunston cites him and partly agrees (prosody cannot simply be carried across contexts); Cheng only lists him among those who characterise prosody in different ways. He is not in my folder. Hoey's views reach me through Partington 2004 and Stewart 2010.</p>`;

  $$("[data-cite]",main).forEach(b=>b.onclick=()=>copy(plain(LIT.find(l=>l.id===b.dataset.cite).cite)));
  if(tab==="vocab")$$("tr[data-copy]",main).forEach(r=>r.onclick=()=>{const v=VOCAB[r.dataset.copy];copy(plain(v[0]+": "+v[1]))});
  if(tab==="defs"){$("#defq").oninput=e=>{const q=e.target.value.toLowerCase();$$("#deft tbody tr").forEach(r=>r.hidden=q&&!r.textContent.toLowerCase().includes(q))}}
  if(tab==="lit"){
    $$(".card>button",main).forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",!o);$(".body",b.parentElement).hidden=o});
    $$("#phf [data-ph]").forEach(b=>b.onclick=()=>setPhase(b.dataset.ph));
    $("#warnf").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);$$("#phf [data-ph]").forEach(b=>b.setAttribute("aria-pressed",false));$$(".card").forEach(c=>c.hidden=on&&c.dataset.warn!=="1")};
    $("#expall").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);e.target.textContent=on?"Collapse all":"Expand all";$$(".card").forEach(c=>{c.firstElementChild.setAttribute("aria-expanded",on);$(".body",c).hidden=!on})};
  }
  if(tab==="debate"){
    requestAnimationFrame(()=>$$(".fill").forEach(f=>f.style.width=f.dataset.w+"%"));
    $$("#fps .fp>button").forEach(b=>b.onclick=()=>{const s=b.nextElementSibling,o=!s.hidden;s.hidden=o;b.setAttribute("aria-expanded",!o);b.lastElementChild.textContent=o?"+":"−"});
    $("#fps .fp>button")&&$("#fps .fp>button").click();
  }
  if(tab==="refs"){$("#copyall").onclick=()=>copy([...LIT].sort((a,b)=>plain(a.cite).localeCompare(plain(b.cite))).map(l=>plain(l.cite)).join("\n\n"))}
  if(tab==="check"){
    let saved={};try{saved=JSON.parse(store("ck")||"{}")}catch(e){}
    const upd=()=>{const all=$$("[data-k]");$("#prog").textContent=all.filter(i=>i.checked).length+" of "+all.length+" checked"};
    $$("[data-k]").forEach(i=>{i.checked=!!saved[i.dataset.k];i.onchange=()=>{saved[i.dataset.k]=i.checked;store("ck",JSON.stringify(saved));upd()}});upd();
  }
}

/* ---------- search ---------- */
const IDX=[];
LIT.forEach(l=>IDX.push({k:"Literature",t:l.short+" ("+(l.yl||l.y)+")",s:l.one,x:plain(l.title+" "+l.f.map(f=>f.join(" ")).join(" ")+" "+l.cite),a:()=>show("lit",{open:l.id})}));
VOCAB.forEach(v=>IDX.push({k:"Vocabulary",t:plain(v[0]),s:plain(v[1]),x:plain(v.join(" ")),a:()=>show("vocab")}));
DEFS.forEach(d=>IDX.push({k:"Definition",t:d[0],s:plain(d[1]),x:plain(d.join(" ")),a:()=>show("defs")}));
FLASH.forEach(f=>IDX.push({k:"Debate",t:f[0],s:plain(f[1]+" / "+f[2]),x:plain(f.join(" ")),a:()=>show("debate")}));
METHODS.forEach(m=>IDX.push({k:"Methods",t:m[0],s:m[1],x:m.join(" "),a:()=>show("methods")}));
OPEN.forEach(o=>IDX.push({k:"Open question",t:o[0],s:o[1],x:o.join(" "),a:()=>show("debate")}));
const qi=$("#q"),res=$("#results");
function search(){
  const q=qi.value.trim().toLowerCase();
  if(q.length<2){res.hidden=true;return}
  const hits=IDX.map(i=>({i,sc:(i.t.toLowerCase().includes(q)?2:0)+(i.x.toLowerCase().includes(q)?1:0)})).filter(h=>h.sc).sort((a,b)=>b.sc-a.sc).slice(0,12);
  res.hidden=false;
  res.innerHTML=hits.length?hits.map((h,n)=>`<button data-n="${n}"><div class="rk">${h.i.k}</div><div class="rt">${h.i.t}</div><div class="rs">${h.i.s.slice(0,110)}</div></button>`).join(""):`<div class="empty">No matches for “${q.replace(/</g,"&lt;")}”</div>`;
  $$("button",res).forEach(b=>b.onclick=()=>{hits[b.dataset.n].i.a();res.hidden=true;qi.value=""});
}
qi.addEventListener("input",search);
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();qi.focus()}
  if(e.key==="Escape"){res.hidden=true;qi.blur()}
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchrow"))res.hidden=true});

/* theme */
$("#themeBtn").onclick=()=>{
  const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.dataset.theme=d?"light":"dark";store("theme",r.dataset.theme);
};
{const t=store("theme");if(t)document.documentElement.dataset.theme=t}

const h=location.hash.slice(1);
show(P[h]?h:(P[store("tab")]?store("tab"):"start"),{keep:true});
</script>
