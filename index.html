:root[data-theme="dark"]{
  --bg:#0f1a21; --surface:#17252e; --ink:#e6eef3; --muted:#9db0bc; --line:#2a3b46;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
header.top{padding-block:22px 12px}
h1{font-family:var(--disp);font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0}
.searchrow{display:flex;gap:10px;align-items:center;position:relative}
.search{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}

.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
#results{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.18)}
#results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
#results button:hover,#results button:focus-visible{background:var(--accent-soft);outline:none}
#results .rt{font-weight:600}#results .rs{color:var(--muted);font-size:13px}
#results .rk{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.chip:focus-visible,.card>button:focus-visible,.btn:focus-visible,.fp>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;cursor:pointer;font:inherit}
main{padding-block:22px 60px}
section.panel[hidden]{display:none}
h2{font-family:var(--disp);font-size:clamp(21px,3.5vw,27px);margin:0 0 4px;text-wrap:balance}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c,var(--accent))}

.lineage{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}

.lin div{font-size:13px;color:var(--muted);margin-top:2px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.note{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:14px;margin:14px 0}

.tl:before{content:"";position:absolute;left:61px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:52px 20px 1fr;align-items:start;gap:0;margin-bottom:6px}
.tl .yr{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;padding-top:9px;padding-right:6px}
.tl .nd{width:10px;height:10px;border-radius:50%;background:var(--c);margin:13px 0 0 5px;position:relative;box-shadow:0 0 0 3px var(--bg)}
.tl button{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit;cursor:pointer}

.card[hidden]{display:none}

.card .t{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.3}
.card .s{grid-column:1;color:var(--muted);font-size:14px}

.card .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}

.card .body{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:0}

.cite{font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 10px;margin:12px 0 8px}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* bars */
.bars{display:grid;gap:10px}

.br .tr{height:16px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}

.br .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* flashpoints */

.fp .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.fp .sides[hidden]{display:none}
.fp .sd{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.fp .sd b{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
@media(max-width:560px){.fp .sides{grid-template-columns:1fr}}
.ul{margin:0;padding-left:20px;display:grid;gap:6px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}

.ck label{cursor:pointer}
.ck input:checked+label{color:var(--muted);text-decoration:line-through}
.prog{font-family:var(--mono);font-size:12px;color:var(--muted)}
.refs{counter-reset:r;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.refs li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;font-size:14px}
.refs li>div{min-width:0}

.empty{color:var(--muted);padding:20px;text-align:center}

mark{background:var(--warn-soft);color:inherit;border-radius:2px}

<script>
/* ---------- DATA (from the master document) ---------- */
const PH={founding:{n:"Founding",c:"--p1"},consol:{n:"Consolidation",c:"--p2"},crit:{n:"Critique",c:"--p3"}};

const LIT=[{"id":"sinclair","y":1991,"yl":"1991–2004","short":"Sinclair","title":"The search for units of meaning (1996) and the unit of meaning","ph":"founding","cite":"Sinclair, J. (1996). The search for units of meaning. *Textus*, IX, 75–106. (Read from my OCR of a scan.) His 1991, 1998 and 2004 works are reported by Stewart, Partington and Louw; details are not in my folder.","one":"Prosody as the functional centre of a lexical item built around a core, from his 1996 article.","tags":["Full text (1996)","Scan, OCR","Other works second-hand"],"warn":"My copy of the 1996 article is a scan that I OCR'd, so check page numbers and wording against the original. The words “obligatory” and “optional” are not in this article; they come from his later work as reported by Stewart and Partington.","f":[["The case","Words enter meaningful relations with the words around them, yet descriptions marginalise this because grammars always get priority (p. 76). He argues for extended units of meaning found by corpus evidence."],["NAKED EYE","Built step by step: collocation (*see*, *visible*), colligation (verbs take *with*, adjectives take *to*), then a semantic preference for visibility. Last, “a semantic prosody of ‘difficulty’, which is evident in over 85% of the instances” (p. 87), e.g. *too faint to be seen with the naked eye*."],["What prosody is","“A semantic prosody (Louw [1993]) is attitudinal, and on the pragmatic side of the semantics/pragmatics continuum.” It “expresses something close to the ‘function’ of the item” and shows how the rest of the item is to be interpreted. “Without it, the string of words just ‘means’ — it is not put to use in a viable communication” (pp. 87–88)."],["The model","“The initial choice of semantic prosody is the functional choice which links meaning to purpose; all subsequent choices within the lexical item relate back to the prosody” (p. 88). The categories are collocation, colligation, semantic preference and semantic prosody, around a core."],["TRUE FEELINGS","In 84 cases from a large corpus: a possessive adjective before the phrase, a semantic preference for “expression”, and a prosody he labels “reluctance”, sometimes close to “inability” (*will never reveal*, *unable to share*) (pp. 89–90)."],["BROOK","Glossed as “tolerate”, but always negative. Its prosody is roughly “reported threat by authority” (p. 91)."],["Why “prosody”","“The precise extent of the prosody, and the nature of its realisation, cannot be determined in advance” (p. 92)."],["Reported by others","Prosody as one of two obligatory elements of the unit of meaning, with the core, and collocation, colligation and preference as optional (Partington 2004; Stewart, 1.1.4). SET IN goes with rot, decay and ill-will (Partington)."],["Cross-language note","He reports, from Tognini-Bonelli, that the Italian *a occhio nudo* has the same semantic trace but does not correlate with a prosody of difficulty (p. 88)."],["The term","He cites “Louw [1993]” for “semantic prosody” (p. 87). Louw in turn attributes the term to Sinclair (personal communication, 1988)."]]},{"id":"louw","y":1993,"short":"Louw","title":"Irony in the text or insincerity in the writer?","ph":"founding","cite":"Louw, B. (1993). Irony in the text or insincerity in the writer? The diagnostic potential of semantic prosodies. In M. Baker, G. Francis and E. Tognini-Bonelli (Eds.), *Text and Technology: In Honour of John Sinclair* (pp. 157–176). John Benjamins.","one":"Names the concept and uses it as a test for irony and insincerity.","tags":["Full text"],"f":[["Question","Can a corpus-derived prosody give an objective test for irony and for insincerity?"],["Core claim","Irony draws its effect from a collocative clash: a word is used against the evaluative company it normally keeps, and the reader senses the clash, often subliminally. A consistent background prosody must exist to clash with."],["Evidence","Concordances (18 million words, later 37 million) for *utterly* (overwhelmingly unfavourable), which explains the ominous undertone of Larkin's “Utterly unlike the snow”; *bent on* (destruction, mayhem), making Lodge's “bent on self-improvement” in *Small World* ironic; *days are* in Larkin's “Days”; *fine friend*."],["Insincerity","A British Council speaker called UK–Zimbabwe university links “symptomatic of” the University of Zimbabwe's reputation. *Symptomatic of* collocates with paranoia and disorders, so Louw suggests the clash may reveal a concealed attitude."],["Other points","Prosody can split by grammar (BUILD UP is good when transitive with a human subject, bad when intransitive). Prosodies “hunt in packs”. They are “essentially a phenomenon that has been only revealed computationally”, so intuition cannot reliably find them."],["Why it matters","It set up the two claims critics attack most: deviation signals irony or insincerity, and prosody is hidden from intuition."]]},{"id":"part98","y":1998,"short":"Partington","title":"Connotation and semantic prosody","ph":"consol","cite":"Partington, A. (1998). Connotation and semantic prosody. Ch. 4 of *Patterns and Meanings* (pp. 65–78). John Benjamins.","one":"Places prosody inside the older idea of connotation.","tags":["Full text"],"f":[["Question","How does prosody fit within older ideas of connotation, and what is it good for?"],["Data","Newspaper CD-ROMs (*The Independent* 1992, *The Telegraph* 1993); ten dictionary titles: three general dictionaries (1967, 1988, 1993), three learner dictionaries from the 1980s and four from 1995."],["Findings","Three connotation types: social/situational, cultural, expressive. Prosody is one subtle aspect of expressive connotation: the spreading of connotational colouring beyond single word boundaries. COMMIT (41 citations: grievous bodily harm, suicide, deception) and RIFE (crime, disease, poverty) carry an unfavourable prosody. SET IN is unflagged in three non-learner dictionaries but flagged by Cobuild 1987 and all four 1995 learner dictionaries. PEDDLE is almost always unfavourable, and three of the four 1995 learner dictionaries show this (Cobuild, CIDE, OALD) while LDOCE 1995 is silent."],["Beyond words","In 58 lines DEALINGS has only four explicit value-judgement modifiers (three unfavourable, one favourable) but sits with *investigation into, allegations about, disreputable parties*, so prosody can work above single words. GREEN FUNDAMENTALISM shows a newspaper, probably unwittingly, giving a collocation status by repetition. English IMPRESSIVE vs Italian *impressionante* is a prosodic false friend."]]},{"id":"part04","y":2004,"short":"Partington","title":"“Utterly content in each other's company”","ph":"consol","cite":"Partington, A. (2004). “Utterly content in each other's company”: Semantic prosody and semantic preference. *International Journal of Corpus Linguistics*, 9(1), 131–156.","one":"Separates semantic preference from semantic prosody.","tags":["Full text","2 copies"],"f":[["Question","What are semantic prosody and semantic preference, and how do they relate?"],["HAPPEN group","1-million-word academic corpus. SET IN almost always unfavourable. Of 50 lines each, *happened* is bad in 24, good in 5, neutral in 21; *occur* bad in 36 of 150 lines vs good in 14; *take place* unfavourable in 31 of 131 vs favourable in 11; *come about* shows little prosody. HAPPEN and OCCUR also prefer non-factual contexts (modals, questions, conditionals)."],["Maximizers","*Absolutely* prefers superlatives; *perfectly* favourable items; *utterly, totally, completely, entirely* prefer “absence” and “change of state”; only *utterly* is described as carrying an unfavourable prosody. *Utterly pleasant* is possible as a deliberate exception."],["Relationship","Preference is a set of collocates; prosody can extend over a wider stretch. Examples: UNDERGO, CAUSE, BROOK."],["Terminology","Disagrees with Stubbs's “discourse prosody”: because competent speakers share primings, prosody is not wholly outside semantics, so he keeps “semantic”."],["Strength varies","SET IN near-categorical; BENT ON less so (*bent on a career in computing* is not ironic); prosody may differ by genre (LAVISH)."]]},{"id":"hoey","y":2005,"short":"Hoey","title":"Lexical Priming","ph":"consol","cite":"Hoey, M. (2005). *Lexical Priming: A New Theory of Words and Language*. Routledge (e-book edition doi:10.4324/9780203327630). Known to me only through Stewart (1.1.10, ch. 8).","one":"A psychological account in which words are primed in the speaker (second-hand).","tags":["Second-hand","Not read"],"warn":"I have no Hoey text. This entry follows Stewart’s account; check against the book before citing.","f":[["Priming","A word becomes “cumulatively loaded with the contexts and co-texts in which it is encountered” (Hoey 2005: 8, quoted by Stewart)."],["Scope","Priming goes beyond the sentence and beyond a fixed window, applies to all lexical items, and belongs to the individual: “Words are never primed per se; they are only primed for someone” (2005: 15)."],["Prosody and preference","He calls Louw’s version disputed (citing Whitsitt) and different from Sinclair’s, and warns against blurring semantic prosody and semantic preference. He admits he conflated them in earlier work."],["Semantic association","He prefers “semantic association” to “semantic preference”, because priming leads to a psychological preference in the user. He says the change of term does not mean a difference of position from Sinclair."],["Pragmatic association","A word or sequence associated with features serving the same pragmatic function, e.g. vagueness with SIXTY. Stewart says this overlaps with Sinclair’s prosody."]]},{"id":"hun","y":2007,"short":"Hunston","title":"Semantic prosody revisited","ph":"crit","cite":"Hunston, S. (2007). Semantic prosody revisited. *International Journal of Corpus Linguistics*, 12(2), 249–268. doi:10.1075/ijcl.12.2.09hun","one":"The term names two things; observation is not explanation or prediction.","tags":["Full text","2 copies"],"f":[["Claim 1","Most writers use “semantic prosody” for the implied attitude of a word given its typical companions; Sinclair uses it for the discourse function of a unit of meaning. She suggests “semantic preference” or “attitudinal preference” for the first."],["Counter-examples","In *New Scientist*, CAUSE combines with inanimate processes and no attitude is discernible. BUDGE flips from frustration to determination with a first-person subject. PERSISTENT is negative before a noun but can go either way predicatively."],["Claim 2","Corpus evidence can record a pattern (observation) or explain a reader's reaction, but Louw's claim that an atypical collocation necessarily signals irony is prediction. One clean counter-example, “fresh to the point of invigoration”, undermines the prediction."],["Claim 3","In a 13-article “conflict corpus” of adversarial papers, SEEM(S) TO THINK really adds negative evaluation, SIGNIFICANCE is only the topic of dispute, and TO HAVE sits near negative evaluation in 20 of 28 instances only because the whole corpus is hostile."]]},{"id":"stew","y":2010,"short":"Stewart","title":"Semantic Prosody: A Critical Evaluation","ph":"crit","cite":"Stewart, D. (2010). *Semantic Prosody: A Critical Evaluation*. Routledge Advances in Corpus Linguistics.","one":"Book-length audit; proposes “discourse prosody” vs “semantic prosody”.","tags":["Full text","192-page proof"],"f":[["Aim","Examine the characteristics attributed to the notion, using BNC concordances except where reproducing other scholars’ work. He does not say prosody is fake."],["Ch. 1–3","Sinclair's version is synchronic, functional, unit-based and not restricted to good/bad. Louw’s is word-based and binary, and is treated within both diachronic and synchronic frameworks. The “tainting” metaphor is rarely tested with historical data."],["Ch. 4–5","Accounts disagree, often unacknowledged, on word vs sequence and neutral vs evaluative. Many cited examples do not clearly show evaluation. Criteria for “consistent” are loose."],["Ch. 6","The format of the concordance line shapes what analysts see."],["Ch. 7","Intuition is involved at every step of corpus work, so the claim that prosody is inaccessible to intuition is overstated. Other scholars’ percentage claims and coding schemes rest on analyst intuition."],["Ch. 8","Hoey’s lexical priming overlaps, but its individual, psychological grounding is one of the major differences from the unit of meaning; Stewart also finds common ground and notes a corpus may show primings shared by a community."],["Ch. 9","Split the term into discourse prosody (Sinclair) and semantic prosody (Louw). Open questions include how to define the co-text around a node and a test of the diachronic story."]]},{"id":"part13","y":2015,"yl":"2015","short":"Partington","title":"Evaluative prosody (ch. 10)","ph":"consol","cite":"Partington, A. (2015). Evaluative prosody. In K. Aijmer & C. Rühlemann (Eds.), *Corpus Pragmatics: A Handbook* (pp. 279–303). (Year and book taken from Looi & Cacciato’s reference list; the file itself shows no title page.)","one":"Renames the concept “evaluative prosody” and answers Hunston, Stewart and Whitsitt.","tags":["Full text","Citation incomplete"],"f":[["Data","SiBol 05, a 150-million-word corpus of UK broadsheet newspaper texts from 2005."],["Terminology","Name is much debated: Stubbs mused “pragmatic prosody” or “discourse prosody” (2001; the latter “somewhat tautological”), Bublitz (2003) “emotive prosody”. Partington proposes “evaluative prosody”. Evaluation is a two-term good/bad system, annotated with a reason, e.g. (good: pleasurable), [bad: dangerous]."],["Two definitions","Textual: a process, the spreading of evaluation beyond single word boundaries. Lexical: an item has a prosody if it typically co-occurs with words of one polarity, especially where this is not obvious."],["Examples","*Brimming with* sits with positive items (confidence, hope). *Fraught with* has 326 occurrences: danger/s 67, risk/s 21, peril 10, hazards 2; it prefers danger, difficulty/problems, complications and anxiety."],["Responses","Hunston's word-vs-text worry is “a false” dichotomy: “two ways of viewing the same phenomenon”. Stewart: speakers use prosody intuitively even if they cannot articulate it. Whitsitt (2005): diachronic change is empirical and cannot be derived from a synchronic corpus; Partington offers case studies as “very strong empirical evidence” that prosodies develop."],["How common","Partington reporting Stubbs: about 5% of words in a 1,000-word sample (2001: 107). Sinclair: part of every unit of meaning. Stubbs’s definition, as Partington reports it, is narrower, limited to non-obvious polarity."],["Variation","BUILD UP changes with syntax (Louw); LAVISH is bad in crime reporting but good in arts reviews; BUDGE depends on control (Duguid 2011)."],["Conclusion","Prosody exists because discourse must cohere evaluatively; it offers “perhaps the strongest evidence ever uncovered that, in normal communication, lexical items are co-selected”."]]}];

P.start=()=>`
<h2>The idea in one paragraph</h2>
<p class="lede">Drawn only from Sinclair, Louw, Hunston, Stewart, Hoey and Partington.</p>
<p class="big">Louw defines semantic prosody as “a consistent aura of meaning with which a form is imbued by its collocates” (1993: 157). For Sinclair it is the functional element of the unit of meaning. The six linguists use one term for two different things, and most of what they write is about sorting that out.</p>
<h3>Where it came from</h3>
<div class="lineage">
 <div class="lin"><b>Firth</b><div>Louw ties the term to Firth’s phonological “colouring”</div></div>
 <div class="lin"><b>1991–2004</b><div>Sinclair: the unit of meaning, with prosody as an obligatory part</div></div>
 <div class="lin"><b>1993</b><div>Louw names it in print and uses it to diagnose irony</div></div>
 <div class="lin"><b>1998–2004</b><div>Partington ties it to connotation, then separates it from preference</div></div>
 <div class="lin"><b>2005</b><div>Hoey: lexical priming and semantic association</div></div>
 <div class="lin"><b>2007–2010</b><div>Hunston and Stewart show the term names more than one thing</div></div>
 <div class="lin"><b>2015</b><div>Partington renames it “evaluative prosody”</div></div>
</div>
<h3>The arc in three moves</h3>
<div class="grid">
 <div class="box"><span class="eyebrow">Founding</span><p>Sinclair identifies it as part of the unit of meaning, and Louw names it and uses it as an irony test.</p><button class="btn alt" data-go="lit" data-f="founding">See founding works</button></div>
 <div class="box"><span class="eyebrow">Consolidation</span><p>Partington ties it to connotation and separates it from preference; Hoey builds a psychological account.</p><button class="btn alt" data-go="lit" data-f="consol">See consolidation</button></div>
 <div class="box"><span class="eyebrow">Critique</span><p>Hunston shows the term names two things, and Stewart audits every claim and proposes a split.</p><button class="btn alt" data-go="lit" data-f="crit">See critique</button></div>
</div>
<h3>Three things to remember</h3>
<ol class="ul">
 <li><b>Prosody is not preference.</b> Preference is the semantic set of the collocates; prosody is the attitude or function (Partington 2004; Hoey 2005; Hunston 2007).</li>
 <li><b>The label collides.</b> Hunston reserves “semantic prosody” for Sinclair’s functional sense; Stewart calls that same sense “discourse prosody”. I say whose labels I use.</li>
 <li><b>Sinclair and Louw are not the same claim.</b> Sinclair’s is functional and unit-based; Louw’s is evaluative and word-based (Stewart, ch. 9).</li>
</ol>`;

P.methods=()=>`
<h2>Methods and statistics</h2><p class="lede">All six work from concordance lines. They differ in how they decide that a collocate is evaluative, and in how much they trust intuition.</p>
<div class="tw"><table><thead><tr><th>Tool or step</th><th>What it does</th><th>Where it appears</th><th>Known limit</th></tr></thead><tbody>
${METHODS.map(r=>`<tr>${r.map(c=>`<td>${em(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
<h3>Two recurring cautions</h3>
<div class="grid"><div class="box"><b>A specialised corpus can manufacture prosody.</b><p>Hunston's 13-article conflict corpus shows almost any word sitting near negative evaluation when every text is hostile.</p></div>
<div class="box"><b>The label is a judgement.</b><p>Stewart argues that intuition enters at every step of corpus work, including the labels analysts give to collocates, even though Louw says prosody is only revealed computationally.</p></div></div>`;

P.debate=()=>`
<h2>The debate</h2>
<p class="lede">Many disagreements are partly terminological. The substantive ones concern (1) word versus unit, (2) observation versus explanation or prediction, (3) whether prosody is hidden from intuition.</p>
<div class="grid" style="margin-top:12px">
 <div class="box"><b>Hunston on CAUSE</b><p>In <em>New Scientist</em>, CAUSE combines with inanimate processes and no attitude is discernible, so the classic example does not always show a prosody.</p></div>
 <div class="box"><b>Louw on BUILD UP</b><p>BUILD UP is good when transitive with a human subject and bad when intransitive, so grammar can split a prosody.</p></div>
</div>
<h3>Flashpoints</h3>
<div id="fps">${FLASH.map((f,i)=>`<div class="fp"><button aria-expanded="false"><span>${f[0]}</span><span aria-hidden="true">+</span></button><div class="sides" hidden><div class="sd"><b>Position A</b>${em(f[1])}</div><div class="sd"><b>Position B</b>${em(f[2])}</div></div></div>`).join("")}</div>
<h3>Terminology map</h3>
<div class="tw"><table><thead><tr><th>Author</th><th>Term used</th><th>What it covers</th></tr></thead><tbody>${TERMS.map(r=>`<tr>${r.map(c=>`<td>${em(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
<h3>Where the six agree</h3>
<ul class="ul">${AGREE.map(a=>`<li><b>${a[0]}.</b> ${em(a[1])}</li>`).join("")}</ul>
<h3>Open questions</h3>
<div class="tw"><table><thead><tr><th>Question</th><th>Where it comes from</th></tr></thead><tbody>${OPEN.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td></tr>`).join("")}</tbody></table></div>
<h3>The outside sceptic</h3>
<p>Whitsitt (2005) is the sceptic whom Hoey, Hunston and Partington discuss. Hoey cites him on Louw’s version, Hunston partly agrees that prosody cannot simply be carried across contexts, and Partington (2015) answers his diachronic objection with case studies. He is not in my folder, and I have not read him.</p>`;

P.refs=()=>`
<h2>Complete reference list</h2><p class="lede">The works of the six linguists, alphabetical. Hoey and most of Sinclair are second-hand. Where a file did not show a journal, year or volume, that is stated rather than filled in.</p>
<div class="row" style="margin-bottom:12px"><button class="btn" id="copyall">Copy all citations</button></div>
<ol class="refs">${[...LIT].sort((a,b)=>plain(a.cite).localeCompare(plain(b.cite))).map(l=>`<li><div>${em(l.cite)}${l.tags.some(t=>/copies/.test(t))?"":""}</div><button class="btn alt" data-cite="${l.id}">Copy</button></li>`).join("")}</ol>
<h3>Cited by the six, not in my folder</h3><p>${REFS_OUT}</p>
<h3>Glossary</h3>
<div class="gl">${VOCAB.map(v=>`<div><b>${em(v[0])}</b><div>${em(v[1])}</div></div>`).join("")}</div>`;

P.check=()=>{
 const n=Object.values(CHECK).flat().length;
 return `<h2>Check before citing</h2><p class="lede">Tick items off as I verify them. Ticks stay in this browser.</p>
 <p class="prog" id="prog"></p>
 ${Object.entries(CHECK).map(([g,items])=>`<h3>${g}</h3>${items.map((t,i)=>{const id=g.replace(/\W/g,"")+i;return `<div class="ck"><input type="checkbox" id="k-${id}" data-k="${id}"><label for="k-${id}">${em(t)}</label></div>`}).join("")}`).join("")}
 <h3>Reading status of the folder</h3>
 <div class="tw"><table><thead><tr><th>Status</th><th>Works</th></tr></thead><tbody>
 <tr><td>Read from full text</td><td>Louw, Hunston, Stewart, Partington 1998, 2004 and 2015</td></tr>
 <tr><td>Second-hand only</td><td>Sinclair and Hoey (through Stewart, Partington and Louw)</td></tr></tbody></table></div>`;
};

/* ---------- shell ---------- */
let cur="start";
const main=$("#main");
function show(tab,opts={}){
  if(!P[tab])tab="start";cur=tab;
  main.innerHTML=`<section class="panel" id="panel-${tab}">${P[tab]()}</section>`;
  $$(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
  wire(tab);store("tab",tab);
  try{history.replaceState(null,"","#"+tab)}catch(e){}
  if(!opts.keep)window.scrollTo({top:0});
  if(opts.filter)setPhase(opts.filter);
  if(opts.open)openCard(opts.open);
}
$("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="false">${t[1]}</button>`).join("");
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(b.dataset.t)});

function setPhase(ph){
  $$("#phf [data-ph]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ph===ph));
  $("#warnf")&&$("#warnf").setAttribute("aria-pressed","false");
  $$(".card").forEach(c=>c.hidden=!(ph==="all"||c.dataset.ph===ph));
}
function openCard(id){
  const c=$("#c-"+id);if(!c)return;
  $$(".card").forEach(x=>x.hidden=false);
  $$("#phf [data-ph]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ph==="all"));
  const b=$("button",c);b.setAttribute("aria-expanded","true");$(".body",c).hidden=false;
  c.scrollIntoView({block:"start",behavior:"smooth"});
  c.style.outline="2px solid var(--accent)";setTimeout(()=>c.style.outline="",1800);
}
function wire(tab){
  $$("[data-go]",main).forEach(b=>b.onclick=()=>show("lit",{filter:b.dataset.f}));
  $$("[data-open]",main).forEach(b=>b.onclick=()=>show("lit",{open:b.dataset.open}));
  $$("[data-cite]",main).forEach(b=>b.onclick=()=>copy(plain(LIT.find(l=>l.id===b.dataset.cite).cite)));
  if(tab==="vocab")$$("tr[data-copy]",main).forEach(r=>r.onclick=()=>{const v=VOCAB[r.dataset.copy];copy(plain(v[0]+": "+v[1]))});
  if(tab==="defs"){$("#defq").oninput=e=>{const q=e.target.value.toLowerCase();$$("#deft tbody tr").forEach(r=>r.hidden=q&&!r.textContent.toLowerCase().includes(q))}}
  if(tab==="lit"){
    $$(".card>button",main).forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",!o);$(".body",b.parentElement).hidden=o});
    $$("#phf [data-ph]").forEach(b=>b.onclick=()=>setPhase(b.dataset.ph));
    $("#warnf").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);$$("#phf [data-ph]").forEach(b=>b.setAttribute("aria-pressed",false));$$(".card").forEach(c=>c.hidden=on&&c.dataset.warn!=="1")};
    $("#expall").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);e.target.textContent=on?"Collapse all":"Expand all";$$(".card").forEach(c=>{c.firstElementChild.setAttribute("aria-expanded",on);$(".body",c).hidden=!on})};
  }
  if(tab==="debate"){
    requestAnimationFrame(()=>$$(".fill").forEach(f=>f.style.width=f.dataset.w+"%"));
    $$("#fps .fp>button").forEach(b=>b.onclick=()=>{const s=b.nextElementSibling,o=!s.hidden;s.hidden=o;b.setAttribute("aria-expanded",!o);b.lastElementChild.textContent=o?"+":"−"});
    $("#fps .fp>button")&&$("#fps .fp>button").click();
  }
  if(tab==="refs"){$("#copyall").onclick=()=>copy([...LIT].sort((a,b)=>plain(a.cite).localeCompare(plain(b.cite))).map(l=>plain(l.cite)).join("\n\n"))}
  if(tab==="check"){
    let saved={};try{saved=JSON.parse(store("ck")||"{}")}catch(e){}
    const upd=()=>{const all=$$("[data-k]");$("#prog").textContent=all.filter(i=>i.checked).length+" of "+all.length+" checked"};
    $$("[data-k]").forEach(i=>{i.checked=!!saved[i.dataset.k];i.onchange=()=>{saved[i.dataset.k]=i.checked;store("ck",JSON.stringify(saved));upd()}});upd();
  }
}

/* ---------- search ---------- */
const IDX=[];
LIT.forEach(l=>IDX.push({k:"Literature",t:l.short+" ("+(l.yl||l.y)+")",s:l.one,x:plain(l.title+" "+l.f.map(f=>f.join(" ")).join(" ")+" "+l.cite),a:()=>show("lit",{open:l.id})}));
VOCAB.forEach(v=>IDX.push({k:"Vocabulary",t:plain(v[0]),s:plain(v[1]),x:plain(v.join(" ")),a:()=>show("vocab")}));
DEFS.forEach(d=>IDX.push({k:"Definition",t:d[0],s:plain(d[1]),x:plain(d.join(" ")),a:()=>show("defs")}));
FLASH.forEach(f=>IDX.push({k:"Debate",t:f[0],s:plain(f[1]+" / "+f[2]),x:plain(f.join(" ")),a:()=>show("debate")}));
METHODS.forEach(m=>IDX.push({k:"Methods",t:m[0],s:m[1],x:m.join(" "),a:()=>show("methods")}));
OPEN.forEach(o=>IDX.push({k:"Open question",t:o[0],s:o[1],x:o.join(" "),a:()=>show("debate")}));
const qi=$("#q"),res=$("#results");
function search(){
  const q=qi.value.trim().toLowerCase();
  if(q.length<2){res.hidden=true;return}
  const hits=IDX.map(i=>({i,sc:(i.t.toLowerCase().includes(q)?2:0)+(i.x.toLowerCase().includes(q)?1:0)})).filter(h=>h.sc).sort((a,b)=>b.sc-a.sc).slice(0,12);
  res.hidden=false;
  res.innerHTML=hits.length?hits.map((h,n)=>`<button data-n="${n}"><div class="rk">${h.i.k}</div><div class="rt">${h.i.t}</div><div class="rs">${h.i.s.slice(0,110)}</div></button>`).join(""):`<div class="empty">No matches for “${q.replace(/</g,"&lt;")}”</div>`;
  $$("button",res).forEach(b=>b.onclick=()=>{hits[b.dataset.n].i.a();res.hidden=true;qi.value=""});
}
qi.addEventListener("input",search);
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();qi.focus()}
  if(e.key==="Escape"){res.hidden=true;qi.blur()}
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchrow"))res.hidden=true});

/* theme */
$("#themeBtn").onclick=()=>{
  const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.dataset.theme=d?"light":"dark";store("theme",r.dataset.theme);
};
{const t=store("theme");if(t)document.documentElement.dataset.theme=t}

const h=location.hash.slice(1);
show(P[h]?h:(P[store("tab")]?store("tab"):"start"),{keep:true});
</script>


</body>
